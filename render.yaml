services:
  - type: web
    name: shared-todo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DB_PATH
        value: /var/data/todo.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
